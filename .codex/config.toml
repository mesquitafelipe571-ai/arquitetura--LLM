# Equivale ao que `rea setup --client codex` gravaria, mas só para este projeto.
# O Codex só carrega este arquivo quando o projeto está marcado como confiável.
[mcp_servers.rea]
command = "npx"
args = ["-y", "rea-agents@6.8.0", "mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 450

# Servidor MCP do Ollaya (agente `decisao`). Caminho relativo à raiz do projeto;
# instale antes com `npm run ollaya:install`. O primeiro uso de um modelo pode demorar.
[mcp_servers.ollaya]
command = "sh"
args = ["scripts/ollaya.sh", "mcp"]
# Sem pull_model: um download de ~8 GB não sai de uma decisão do modelo; o usuário roda
# `npm run ollaya -- pull winnow:e4b`. decide nunca baixa modelos (sem pull implícito na API).
enabled_tools = ["decide", "list_models", "show_model"]
startup_timeout_sec = 30
tool_timeout_sec = 300
