name: Validar instalador
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes do instalador
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Sintaxe e plano
        run: |
          bash -n scripts/bootstrap-ubuntu.sh
          python3 scripts/setup.py plan
          python3 scripts/paperclip-native.py --help
