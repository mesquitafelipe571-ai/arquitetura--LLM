name: Validar instalador
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Dependência dos testes das skills Office
        run: python3 -m pip install defusedxml==0.7.1
      - name: Testes do instalador
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Sintaxe e plano
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/setup.py plan
          python3 scripts/paperclip-native.py --help
